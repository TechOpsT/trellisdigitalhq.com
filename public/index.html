<style>
  :root {
    --navy: #002648;
    --teal: #01A4BB;
    --slate: #6A747C;
    --ink: #1E2A36;
    --paper: #FFFFFF;
    --line: #D9DFE3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  :root { color-scheme: only light; background: #FFFFFF; }
  html, body, header, main, .hero, section.who, footer {
    background-color: #FFFFFF !important;
    background-image: linear-gradient(#FFFFFF, #FFFFFF) !important;
  }
  h1, h2, .who li strong { color: #002648 !important; }
  .lede, .who li { color: #1E2A36 !important; }
  section.contact { background-color: #002648 !important; background-image: linear-gradient(#002648, #002648) !important; }
  .contact h2 { color: #FFFFFF !important; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 64rem;
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 5vw, 3rem);
  }

  header { background: #fff; padding: clamp(2.25rem, 6vw, 3.5rem) 0; }
  header img { display: block; width: clamp(220px, 38vw, 340px); height: auto; max-width: 100%; margin-left: calc(-1 * clamp(220px, 38vw, 340px) * 0.1); background: #fff; }

  .hero {
    border-top: 6px solid var(--navy);
    background: #fff;
    padding: clamp(2.5rem, 8vw, 5.5rem) 0 clamp(2.5rem, 7vw, 4.5rem);
    position: relative;
    overflow: hidden;
  }
  .hero .wrap { position: relative; z-index: 1; }
  h1 {
    margin: 0;
    max-width: 17ch;
    color: var(--navy);
    font-weight: 800;
    font-size: clamp(2.1rem, 6vw, 3.9rem);
    line-height: 1.06;
    letter-spacing: -0.025em;
  }
  .lede {
    margin: 1.75rem 0 0;
    max-width: 36rem;
    font-size: clamp(1.15rem, 2.2vw, 1.35rem);
    line-height: 1.55;
  }
  .hero .cta {
    display: inline-block;
    margin-top: 2.25rem;
    padding: .9rem 1.5rem;
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    border-radius: 4px;
    border-bottom: 3px solid var(--teal);
  }
  .hero .cta:hover { background: #003a6b; }

  section.who { padding: clamp(3rem, 7vw, 4.5rem) 0; border-top: 1px solid var(--line); }
  h2 {
    margin: 0 0 1.5rem;
    color: var(--navy);
    font-size: clamp(1.4rem, 3vw, 1.75rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .who ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  }
  .who li {
    padding-left: 1rem;
    border-left: 3px solid var(--teal);
    max-width: 22rem;
  }
  .who li strong { display: block; color: var(--navy); font-weight: 700; }

  section.contact {
    background: var(--navy);
    color: #E8EEF2;
    padding: clamp(3rem, 7vw, 4.5rem) 0;
  }
  .contact h2 { color: #fff; }
  .contact p { margin: 0 0 1.75rem; max-width: 34rem; }
  .contact dl {
    margin: 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .6rem 1.5rem;
    align-items: baseline;
  }
  .contact dt { color: #9FB2C2; font-size: .95rem; }
  .contact dd { margin: 0; font-size: 1.2rem; font-weight: 500; }
  .contact a { color: #fff; text-decoration-color: var(--teal); text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .contact a:hover { color: #7FD6E3; }

  footer { padding: 1.75rem 0; color: var(--slate); font-size: .9rem; }

  a:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 2px; }

  @media (max-width: 34rem) {
  }
  </style>
</head>
